<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101422">
<title>ドパドパWordドリル</title>
<link rel="stylesheet" href="phone.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23101422%22/%3E%3Cpath d=%22M3 11h10%22 stroke=%22%234aa8ff%22 stroke-width=%222%22/%3E%3C/svg%3E">
</head>
<body>
<!-- The phone version (SPEC 2.0; ED draft 3): three pages, a sheet and a live region in one
     column that follows the visual viewport, so that the answer row stays above the keyboard
     (SPEC SD-13). -->
<div id="app">
  <!-- V-08: the book list, shown every time the site opens (ED D-81) -->
  <section class="page" id="books">
    <div id="loading" role="status">読み込み中</div>
    <h1>ドパドパWordドリル</h1>
    <p id="list-message" class="message" role="status"></p>
    <div id="list"></div>
    <button id="list-back" class="plain" hidden>戻る</button>
  </section>

  <!-- V-09: the drill (ED D-85) -->
  <section class="page" id="drill" hidden>
    <div class="top"><span id="sentence-of"></span><button id="open-menu">メニュー</button></div>
    <div id="read" aria-hidden="true"></div>
    <div id="notice" role="status"></div>
    <div id="next"></div>
    <div id="choices" hidden></div>
    <div class="row">
      <input id="answer" type="text" lang="en" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="空欄" aria-describedby="answer-description">
      <span class="spacer" id="spacer"></span>
      <button id="go">答える</button>
      <label class="hint" id="hint-label"><input type="checkbox" id="hint">Hint</label>
    </div>
    <div id="answer-description" class="hidden-text"></div>
  </section>

  <!-- V-12: the end of the book (ED D-80) -->
  <section class="page" id="end" hidden>
    <h1 id="end-title"></h1>
    <button id="end-books" class="plain">本をえらぶ</button>
  </section>
</div>

<!-- V-10, V-11, V-13, V-14: the sheet of 「メニュー」 -->
<div id="shade"></div>
<div id="sheet" role="dialog" aria-label="メニュー" hidden>
  <div id="sheet-main">
    <button class="item" data-act="contents">目次</button>
    <button class="item" data-act="books">本をえらぶ</button>
    <button class="item" data-act="settings">設定</button>
    <button class="item" data-act="credits">クレジット</button>
    <button class="item" data-act="close">閉じる</button>
  </div>
  <div id="sheet-sub" hidden></div>
</div>

<div id="live" class="hidden-text" aria-live="polite"></div>
<script type="module" src="js/start.js"></script>
</body>
</html>
